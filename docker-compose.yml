services:
  postgres:
    image: postgres:16

    container_name: ai-banking-postgres

    environment:
      POSTGRES_DB: banking_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Robert@123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: ai-banking-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres

    volumes:
      - ./backend:/app/backend
      - ./database:/app/database

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: ai-banking-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app/frontend

volumes:
  postgres_data:
