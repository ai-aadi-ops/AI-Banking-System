services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: ai-banking-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./backend:/app/backend
      - ./database:/app/database

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: ai-banking-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app/frontend
