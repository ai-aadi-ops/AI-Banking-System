<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 44px; fill: url(#cyanBlue); }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 500; font-size: 18px; fill: #cbd5e1; }
      .badge-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
      .metric-label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .metric-val { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 22px; fill: #f8fafc; }
      .pulse-circle { animation: pulse 3s infinite ease-in-out; transform-origin: center; }
      .bar1 { animation: grow1 2.6s infinite alternate ease-in-out; }
      .bar2 { animation: grow2 2.2s infinite alternate ease-in-out; }
      .bar3 { animation: grow3 2.8s infinite alternate ease-in-out; }
      .bar4 { animation: grow4 2.4s infinite alternate ease-in-out; }
      .float-card { animation: floatY 4s infinite ease-in-out; }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; r: 110px; }
        50% { opacity: 0.5; r: 135px; }
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes grow1 { 0% { height: 35px; y: 235px; } 100% { height: 75px; y: 195px; } }
      @keyframes grow2 { 0% { height: 55px; y: 215px; } 100% { height: 95px; y: 175px; } }
      @keyframes grow3 { 0% { height: 45px; y: 225px; } 100% { height: 85px; y: 185px; } }
      @keyframes grow4 { 0% { height: 70px; y: 200px; } 100% { height: 110px; y: 160px; } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Glowing background orbs -->
  <circle cx="980" cy="170" r="120" fill="#06b6d4" class="pulse-circle" />
  <circle cx="180" cy="60" r="90" fill="#3b82f6" opacity="0.15" />

  <!-- Left Content -->
  <g transform="translate(60, 65)">
    <rect x="0" y="0" width="290" height="32" rx="16" fill="#083344" stroke="#06b6d4" stroke-width="1" />
    <text x="18" y="21" class="badge-text">⚡ NEXT-GEN AI BANKING PLATFORM</text>

    <text x="0" y="88" class="title">AI Banking System</text>
    <text x="0" y="125" class="subtitle">Multi-User Statement Analytics • Multilingual AI Advisor • Smart Loan Engine</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="155" height="34" rx="10" fill="#1e293b" stroke="#334155" />
      <text x="16" y="22" class="badge-text" fill="#e2e8f0">📄 PDF / Excel / OCR</text>

      <rect x="170" y="0" width="165" height="34" rx="10" fill="#1e293b" stroke="#334155" />
      <text x="186" y="22" class="badge-text" fill="#e2e8f0">🌐 10+ Languages</text>

      <rect x="350" y="0" width="165" height="34" rx="10" fill="#1e293b" stroke="#334155" />
      <text x="366" y="22" class="badge-text" fill="#e2e8f0">💱 Multi-Currency</text>

      <rect x="530" y="0" width="165" height="34" rx="10" fill="#1e293b" stroke="#334155" />
      <text x="546" y="22" class="badge-text" fill="#e2e8f0">🤖 Gemini AI Chat</text>
    </g>
  </g>

  <!-- Right Animated Dashboard Preview Card -->
  <g class="float-card">
    <rect x="820" y="45" width="320" height="250" rx="20" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="845" y="82" class="metric-label">LIVE DEMO &amp; USER ANALYTICS</text>
    <text x="845" y="114" class="metric-val">$20,000.00 / ₹ INR</text>
    <rect x="1035" y="92" width="80" height="26" rx="13" fill="#064e3b" />
    <text x="1048" y="109" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#34d399">80/100 AI</text>

    <!-- Animated Chart Bars -->
    <rect x="855" y="200" width="28" height="70" rx="6" fill="#0891b2" class="bar1" />
    <rect x="905" y="180" width="28" height="90" rx="6" fill="#06b6d4" class="bar2" />
    <rect x="955" y="190" width="28" height="80" rx="6" fill="#22d3ee" class="bar3" />
    <rect x="1005" y="165" width="28" height="105" rx="6" fill="#38bdf8" class="bar4" />
    <rect x="1055" y="175" width="28" height="95" rx="6" fill="#60a5fa" class="bar2" />
  </g>
</svg>
